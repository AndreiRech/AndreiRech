<svg fill="none" viewBox="0 0 800 850" width="800" height="850" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                * {
                    margin: 0; padding: 0; color: inherit; text-decoration: none; list-style: none; outline: none; box-sizing: border-box;
                }
                .body {
                    --color-background-dark: #120f20;
                    --color-text-light: #c0c0d0;
                    --color-accent-red: #e73d61;
                    --color-accent-blue: #0f1c40;
                    --color-accent-blue-light: #4a6c8e;
                    --color-money-yellow: #fdd835;
                    --color-glitch-cyan: #0ff;
                    --color-glitch-magenta: #f0f;
                    --color-terminal-green: #0f0;
                    
                    --font-family-mono: 'Courier New', Courier, monospace;

                    height: 850px; width: 800px; display: flex; align-items: center; justify-content: center;
                    background-color: var(--color-background-dark);
                    font-family: var(--font-family-mono);
                    color: var(--color-text-light);
                    overflow: hidden; position: relative;
                    border: 4px solid var(--color-accent-blue-light);
                    box-shadow: 0 0 30px var(--color-accent-blue-light);
                }
                .container {
                    background-color: #0b0918;
                    border: 2px solid var(--color-accent-blue);
                    padding: 20px; display: grid;
                    grid-template-columns: 0.9fr 1.1fr;
                    grid-template-rows: auto 1fr auto;
                    gap: 20px; width: 98%; height: 98%;
                    box-shadow: inset 0 0 15px rgba(0, 191, 255, 0.05);
                    position: relative;
                }
                .glitch-overlay {
                    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                    pointer-events: none; mix-blend-mode: screen; z-index: 10;
                }
                .glitch-line {
                    background-color: var(--color-glitch-cyan); opacity: 0.1;
                    height: 1px; width: 100%; position: absolute;
                    animation: glitchLine 0.5s infinite alternate;
                }
                .glitch-line:nth-child(2) { background-color: var(--color-glitch-magenta); animation-delay: 0.1s; }
                .glitch-line:nth-child(3) { background-color: var(--color-glitch-cyan); opacity: 0.08; animation-delay: 0.2s; }
                .glitch-line:nth-child(4) { background-color: var(--color-glitch-magenta); opacity: 0.05; animation-delay: 0.3s; }

                .section-info {
                    grid-column: 1 / 2; grid-row: 1 / 2; display: flex; flex-direction: column; align-items: center; gap: 10px;
                    border-right: 1px dashed var(--color-accent-blue-light); padding-right: 15px;
                }
                .data-portrait {
                    width: 150px; height: 150px; border-radius: 8px; border: 3px solid var(--color-accent-red);
                    box-shadow: 0 0 15px rgba(231, 61, 97, 0.7); display: flex; align-items: center; justify-content: center;
                    background-color: #05050d; position: relative; overflow: hidden;
                    margin-bottom: 10px;
                }
                .data-portrait-grid {
                    position: absolute; width: 100%; height: 100%;
                    background-size: 15px 15px;
                    background-image: linear-gradient(to right, rgba(74, 108, 142, 0.2) 1px, transparent 1px),
                                      linear-gradient(to bottom, rgba(74, 108, 142, 0.2) 1px, transparent 1px);
                    animation: dataflow 15s linear infinite; z-index: 2;
                }
                .portrait-image {
                    width: 100%; height: 100%; object-fit: cover; position: absolute;
                    top: 0; left: 0; z-index: 1; filter: brightness(1.1) contrast(1.1);
                }
                .bounty {
                    font-size: 2.2rem; font-weight: bold; color: var(--color-money-yellow);
                    text-shadow: 0 0 12px rgba(253, 216, 53, 0.8); animation: pulse 2.5s infinite ease-in-out;
                    font-family: var(--font-family-mono); margin-top: 10px; letter-spacing: 1px;
                }
                .id-number {
                    font-size: 0.8rem; color: rgba(192, 192, 208, 0.7); background-color: rgba(0, 0, 0, 0.5);
                    padding: 5px 10px; border-radius: 3px; letter-spacing: 1px; margin-top: 5px;
                    border: 1px solid var(--color-accent-blue);
                }
                .static-info {
                    font-size: 0.8rem; margin-top: 15px; text-align: center; line-height: 1.5;
                    color: var(--color-accent-blue-light);
                }

                .section-details {
                    grid-column: 2 / 3; grid-row: 1 / 2; display: flex; flex-direction: column; gap: 8px; padding-left: 15px;
                }
                .wanted-header {
                    font-family: var(--font-family-mono); font-size: 1.2rem; font-weight: bold; color: var(--color-accent-red);
                    text-align: center; letter-spacing: 3px;
                    border-bottom: 2px solid var(--color-accent-red); padding-bottom: 10px; margin-bottom: 15px;
                    text-shadow: 0 0 8px var(--color-accent-red);
                }
                .name {
                    font-family: var(--font-family-mono); font-size: 2.2rem; font-weight: bold; color: #fff;
                    text-align: center; margin-bottom: 20px; 
                    animation: neonGlow 3s infinite alternate;
                }
                .info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 15px; font-size: 0.85rem; }
                .info-label { color: var(--color-accent-blue-light); font-weight: bold; letter-spacing: 0.5px; }
                .info-value { color: var(--color-text-light); }
                .criminal-record-header {
                    font-family: var(--font-family-mono); font-size: 0.9rem; font-weight: bold; color: var(--color-accent-red);
                    margin-top: 20px; margin-bottom: 10px;
                    border-bottom: 1px dashed var(--color-accent-blue-light); padding-bottom: 5px; letter-spacing: 0.5px;
                }
                .record-list { font-size: 0.8rem; list-style: none; padding-left: 0; }
                .record-list li { margin-bottom: 4px; position: relative; padding-left: 18px; }
                .record-list li::before { content: "›"; color: var(--color-money-yellow); position: absolute; left: 0; font-weight: bold; }
                
                .section-biometrics {
                    grid-column: 1 / 2; grid-row: 2 / 3;
                    border-right: 1px dashed var(--color-accent-blue-light);
                    padding-right: 15px; padding-top: 15px;
                    display: flex; flex-direction: column; gap: 15px;
                }
                .section-title {
                    font-family: var(--font-family-mono); font-size: 0.9rem; color: var(--color-accent-red); font-weight: bold;
                    margin-bottom: 5px; text-align: center;
                    border-bottom: 1px dashed var(--color-accent-blue-light); padding-bottom: 5px; letter-spacing: 0.5px;
                }
                .scan-item {
                    background-color: rgba(0, 0, 0, 0.4);
                    border: 1px solid var(--color-accent-blue);
                    padding: 8px; border-radius: 4px;
                }
                .scan-label {
                    font-size: 0.75rem; color: var(--color-accent-blue-light); letter-spacing: 1px; margin-bottom: 8px;
                }
                .retina-visual {
                    width: 60px; height: 60px; margin: 0 auto; border-radius: 50%;
                    background: radial-gradient(circle, var(--color-glitch-cyan) 10%, var(--color-accent-blue) 40%, #05050d 70%);
                    border: 1px solid var(--color-accent-blue-light);
                }
                .voice-visual {
                    height: 50px; display: flex; align-items: center; justify-content: center; gap: 2px;
                }
                .voice-bar {
                    width: 3px; background-color: var(--color-text-light);
                    animation: voiceWave 1s infinite alternate;
                }
                .dna-visual {
                     height: 50px; background-color: rgba(0,0,0,0.3); padding: 5px;
                     background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(74, 108, 142, 0.2) 5px, rgba(74, 108, 142, 0.2) 10px);
                }

                .section-terminal {
                    grid-column: 2 / 3; grid-row: 2 / 3; padding-left: 15px; padding-top: 15px;
                    background-color: #05050d; border: 1px solid var(--color-accent-blue);
                    padding: 15px; border-radius: 5px;
                    font-family: var(--font-family-mono); font-size: 0.8rem;
                    color: var(--color-terminal-green); line-height: 1.4;
                    position: relative; overflow: hidden;
                }
                .terminal-prompt { color: var(--color-terminal-green); }
                .terminal-input { color: #fff; }
                .terminal-cursor {
                    display: inline-block; width: 8px; height: 1em; background-color: var(--color-terminal-green);
                    margin-left: 2px; animation: blink-caret 0.75s step-end infinite;
                }
                .terminal-output { color: #9c9; }
                
                /* NOVO: Estilos para o Terminal de Status no Rodapé */
                .section-status-log {
                    grid-column: 1 / 3; /* Ocupa toda a largura inferior */
                    grid-row: 3 / 4;
                    background-color: #05050d;
                    border-top: 1px dashed var(--color-accent-blue-light);
                    padding: 10px 15px;
                    font-family: var(--font-family-mono);
                    font-size: 0.75rem;
                    color: var(--color-accent-blue-light);
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    flex-wrap: wrap; /* Garante responsividade mínima */
                    gap: 10px;
                    animation: textFlicker 7s infinite;
                }
                .section-status-log .log-user {
                    color: var(--color-text-light);
                    font-weight: bold;
                }
                .section-status-log .log-status {
                    color: var(--color-terminal-green);
                }

                .scan-effect {
                    position: absolute; top: 0; left: 0; width: 100%; height: 2%;
                    background: linear-gradient(to right, transparent, rgba(0, 191, 255, 0.2), transparent);
                    box-shadow: 0 0 15px rgba(0, 191, 255, 0.7);
                    animation: scan 8s infinite linear;
                    pointer-events: none; opacity: 0.7; z-index: 9;
                }

                @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(3600%); } }
                @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.02); opacity: 0.95; } }
                @keyframes glitchLine { 0% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(5px) scaleX(0.98); } 100% { transform: translateY(0) scaleX(1); } }
                @keyframes dataflow { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }
                @keyframes neonGlow { 0%, 100% { text-shadow: 0 0 5px rgba(255,255,255,0.4), 0 0 10px rgba(0,255,255,0.6); } 50% { text-shadow: 0 0 8px #fff, 0 0 15px var(--color-glitch-cyan), 0 0 25px var(--color-glitch-magenta); } }
                @keyframes blink-caret { from, to { background-color: transparent; } 50% { background-color: var(--color-terminal-green); } }
                @keyframes voiceWave { 0% { height: 10%; } 25% { height: 100%; } 50% { height: 40%; } 75% { height: 80%; } 100% { height: 10%; } }
                @keyframes textFlicker { 0%, 100% { opacity: 1; } 49% { opacity: 1; } 50% { opacity: 0.8; } 51% { opacity: 1; } }
            </style>
            <div class='body'>
                <div class='container'>
                    <div class="glitch-overlay">
                        <div class="glitch-line" style="top: 10%;"></div>
                        <div class="glitch-line" style="top: 30%;"></div>
                        <div class="glitch-line" style="top: 50%;"></div>
                        <div class="glitch-line" style="top: 70%;"></div>
                        <div class="glitch-line" style="top: 90%;"></div>
                    </div>
                    
                    <div class='section-info'>
                        <div class='data-portrait'>
                            <img src="data:image/jpeg;base64,/9j/4A...B==" alt="Andrei Rech Portrait" class="portrait-image" />
                            <div class="data-portrait-grid"></div>
                        </div>
                        <div class='bounty'>₩ 5,000,000</div>
                        <div class='id-number'>GH-USER-136367100</div>
                        <div class="static-info">
                            <div>STATUS: AT LARGE</div>
                            <div>AFFILIATION: FREELANCE NETRUNNER</div>
                        </div>
                    </div>

                    <div class='section-details'>
                        <div class='wanted-header'>WANTED DEVELOPER</div>
                        <div class='name'>ANDREI RECH</div>
                        <div class='info-grid'>
                            <span class='info-label'>LOCATION:</span><span class='info-value'>Porto Alegre, RS, Brazil</span>
                            <span class='info-label'>WORK:</span><span class='info-value'>Apple Developer Academy</span>
                            <span class='info-label'>FOCUS:</span><span class='info-value'>Full-Stack Dev | iOS Dev</span>
                            <span class='info-label'>LANGUAGES:</span><span class='info-value'>Java, JS, TS, Python, C, Go, Swift</span>
                            <span class='info-label'>FRAMEWORKS:</span><span class='info-value'>React, Node, FastAPI, Spring</span>
                            <span class='info-label'>TOOLS:</span><span class='info-value'>Docker, Git, Postgres, MongoDB, OracleSQL</span>
                        </div>
                        <div class='criminal-record-header'>CURRENT ACTIVITIES</div>
                        <ul class='record-list'>
                            <li>Learning Japanese</li><li>Exploring new tech</li><li>Building cool projects</li><li>Gaming, Music, Books, Animes</li>
                        </ul>
                    </div>

                    <div class="section-biometrics">
                        <div class="section-title">BIOMETRIC SCAN</div>
                        <div class="scan-item">
                            <div class="scan-label">RETINA</div>
                            <div class="retina-visual"></div>
                        </div>
                        <div class="scan-item">
                            <div class="scan-label">VOICE PRINT</div>
                            <div class="voice-visual">
                                <div class="voice-bar" style="animation-delay: 0.1s; height: 40%;"></div><div class="voice-bar" style="animation-delay: 0.2s; height: 80%;"></div><div class="voice-bar" style="animation-delay: 0.3s; height: 60%;"></div><div class="voice-bar" style="animation-delay: 0.4s; height: 100%;"></div><div class="voice-bar" style="animation-delay: 0.5s; height: 30%;"></div><div class="voice-bar" style="animation-delay: 0.6s; height: 70%;"></div><div class="voice-bar" style="animation-delay: 0.7s; height: 50%;"></div><div class="voice-bar" style="animation-delay: 0.8s; height: 90%;"></div><div class="voice-bar" style="animation-delay: 0.9s; height: 20%;"></div><div class="voice-bar" style="animation-delay: 1.0s; height: 60%;"></div><div class="voice-bar" style="animation-delay: 0.15s; height: 40%;"></div><div class="voice-bar" style="animation-delay: 0.25s; height: 80%;"></div><div class="voice-bar" style="animation-delay: 0.35s; height: 60%;"></div><div class="voice-bar" style="animation-delay: 0.45s; height: 100%;"></div><div class="voice-bar" style="animation-delay: 0.55s; height: 30%;"></div><div class="voice-bar" style="animation-delay: 0.65s; height: 70%;"></div><div class="voice-bar" style="animation-delay: 0.75s; height: 50%;"></div><div class="voice-bar" style="animation-delay: 0.85s; height: 90%;"></div><div class="voice-bar" style="animation-delay: 0.95s; height: 20%;"></div><div class="voice-bar" style="animation-delay: 1.05s; height: 60%;"></div><div class="voice-bar" style="animation-delay: 0.18s; height: 40%;"></div><div class="voice-bar" style="animation-delay: 0.28s; height: 80%;"></div><div class="voice-bar" style="animation-delay: 0.38s; height: 60%;"></div><div class="voice-bar" style="animation-delay: 0.48s; height: 100%;"></div><div class="voice-bar" style="animation-delay: 0.58s; height: 30%;"></div>
                            </div>
                        </div>
                        <div class="scan-item">
                            <div class="scan-label">DNA FINGER PRINT</div>
                            <div class="dna-visual"></div>
                        </div>
                    </div>

                    <div class="section-terminal">
                        <span class="terminal-prompt">> Accessing data logs...</span><br/>
                        <span class="terminal-output">>> Fetching latest commits...</span><br/>
                        <span class="terminal-output">>> Status: Online and Coding.</span><br/>
                        <span class="terminal-output">>> Ready for deployment.</span><br/>
                        <span class="terminal-prompt">> <span class="terminal-cursor"></span></span>
                    </div>
                    
                    <div class="section-status-log">
                        <span class="log-user">> USER: AndreiRech</span>
                        <span class="log-status">> STATUS: SYSTEM ONLINE</span>
                        <span>> LAST KNOWN COORDINATES: 30.0346° S, 51.2177° W</span>
                    </div>

                </div>
                <div class="scan-effect"></div>
            </div>
        </div>
    </foreignObject>
</svg>

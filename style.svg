<svg fill="none" viewBox="0 0 600 400" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                .body {
                    --color-background-dark: #222c3c;
                    --color-text-light: #ffffff;
                    --color-accent-red: #ff4d4d;
                    --color-accent-blue: #00bfff;
                    --color-money-yellow: #f8e71c;
                    --font-family-mono: 'Space Mono', monospace;
                    height: 400px; width: 100%; display: flex; align-items: center; justify-content: center;
                    background-color: var(--color-background-dark);
                    font-family: var(--font-family-mono); color: var(--color-text-light);
                    overflow: hidden; position: relative;
                }
                .container {
                    background-color: #1a222c; border: 2px solid var(--color-accent-blue);
                    padding: 20px; display: grid; grid-template-columns: 1fr 1.5fr;
                    gap: 20px; width: 90%; max-width: 550px; height: 90%;
                    box-shadow: 0 0 15px rgba(0, 191, 255, 0.5); position: relative;
                }
                .section-left { display: flex; flex-direction: column; align-items: center; gap: 15px; }
                
                /* Avatar modificado para mostrar '?' */
                .avatar {
                    width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--color-accent-blue);
                    box-shadow: 0 0 10px rgba(0, 191, 255, 0.7);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 5rem;
                    color: var(--color-accent-blue);
                    text-shadow: 0 0 8px var(--color-accent-blue);
                    background-color: rgba(0,0,0,0.2);
                }
                .avatar::before {
                    content: '?';
                }

                .bounty { 
                    font-size: 1.8rem; font-weight: bold; color: var(--color-money-yellow);
                    text-shadow: 0 0 8px rgba(248, 231, 28, 0.7);
                    animation: pulse 2.5s infinite ease-in-out; /* Animação de pulsação */
                }
                .id-number { font-size: 0.9rem; color: rgba(255, 255, 255, 0.8); background-color: rgba(0, 0, 0, 0.3); padding: 5px 10px; border-radius: 3px; letter-spacing: 1px; }
                .section-right { display: flex; flex-direction: column; gap: 10px; }
                .wanted-header { font-size: 1.2rem; font-weight: bold; color: var(--color-accent-red); text-align: center; letter-spacing: 2px; border-bottom: 1px dashed var(--color-accent-blue); padding-bottom: 5px; margin-bottom: 10px; }
                .name { font-size: 1.6rem; font-weight: bold; color: var(--color-text-light); text-align: center; margin-bottom: 10px; }
                .info-grid { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 0.85rem; }
                .info-label { color: var(--color-accent-blue); font-weight: bold; }
                .info-value { color: var(--color-text-light); }
                .criminal-record-header { font-size: 1rem; font-weight: bold; color: var(--color-accent-red); margin-top: 15px; margin-bottom: 5px; border-bottom: 1px dashed var(--color-accent-blue); padding-bottom: 3px; }
                .record-list { font-size: 0.8rem; list-style: none; padding-left: 0; }
                .record-list li { margin-bottom: 3px; position: relative; padding-left: 15px; }
                .record-list li::before { content: "•"; color: var(--color-accent-blue); position: absolute; left: 0; }

                /* Efeito de Scan */
                .scan-effect {
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 2%;
                    background: rgba(0, 191, 255, 0.3);
                    box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
                    animation: scan 5s infinite linear;
                    pointer-events: none;
                }

                /* Keyframes para as animações */
                @keyframes scan {
                    0% { transform: translateY(-100%); }
                    100% { transform: translateY(2000%); } /* Aumentado para garantir que passe por tudo */
                }

                @keyframes pulse {
                    0%, 100% { transform: scale(1); text-shadow: 0 0 8px rgba(248, 231, 28, 0.7); }
                    50% { transform: scale(1.05); text-shadow: 0 0 15px rgba(248, 231, 28, 1); }
                }

            </style>
            <div class='body'>
                <div class='container'>
                    <div class='section-left'>
                        <div class='avatar'></div>
                        <div class='bounty'>₩ 5,000,000</div>
                        <div class='id-number'>GH-USER-136367100</div>
                    </div>
                    <div class='section-right'>
                        <div class='wanted-header'>WANTED DEVELOPER</div>
                        <div class='name'>Andrei Rech</div>
                        <div class='info-grid'>
                            <span class='info-label'>FOCUS:</span><span class='info-value'>Full-Stack Dev</span>
                            <span class='info-label'>LANGUAGES:</span><span class='info-value'>Java, JS, Python, C</span>
                        </div>
                        <div class='criminal-record-header'>CURRENT ACTIVITIES</div>
                        <ul class='record-list'>
                            <li>Learning Japanese</li>
                            <li>Building cool projects</li>
                        </ul>
                    </div>
                </div>
                <div class="scan-effect"></div>
            </div>
        </div>
    </foreignObject>
</svg>
